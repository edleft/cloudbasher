name: Validate public repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Required policy files
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in LICENSE AI_USAGE.md LICENSE-FAQ.md README.md; do
            test -s "$f" || { echo "Missing/empty $f" >&2; exit 1; }
          done

      - name: Block obvious private-development artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden='(^|/)(\.public-export|scripts/export-public\.sh|scripts/validate-public\.sh|\.claude|\.codex|private|internal)(/|$)'
          if git ls-files | grep -E "$forbidden"; then
            echo "Private/development-only path found in public repository" >&2
            exit 1
          fi
